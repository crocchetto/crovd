name: build docker image

on:
  push:
    branches:
      - "main"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: crocchetto/${{ github.event.repository.name }}:${{ github.ref_name }}
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.ref_name }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      cachebust: ${{ steps.decide.outputs.cachebust }}
    steps:
      - name: Decide Whether To Build
        id: decide
        run: |
          case "${{ github.event_name }}" in
            push)
              echo "build=true" >> "$GITHUB_OUTPUT"
              echo "cachebust=static" >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              echo "build=true" >> "$GITHUB_OUTPUT"
              echo "cachebust=manual-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              latest=$(docker run --rm alpine:3.22 sh -c 'apk update -q >/dev/null 2>&1; apk policy yt-dlp 2>/dev/null | grep -oE "^[0-9][^:]*" | head -1' | sed "s/-r[0-9]*$//")
              current=$(docker run --rm ${{ env.IMAGE }} yt-dlp --version 2>/dev/null || echo "none")
              echo "alpine edge: '$latest' / published: '$current'"
              if [ -n "$latest" ] && [ "$latest" != "$current" ]; then
                echo "build=true" >> "$GITHUB_OUTPUT"
                echo "cachebust=$latest" >> "$GITHUB_OUTPUT"
              else
                echo "build=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
          esac

  build-images:
    needs: [check]
    if: needs.check.outputs.build == 'true'
    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.arch }} image
        uses: docker/build-push-action@v6
        with:
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          file: ./Dockerfile
          build-args: |
            YTDLP_CACHEBUST=${{ needs.check.outputs.cachebust }}
          tags: |
            ${{ env.IMAGE }}-${{ matrix.arch }}
            ${{ env.GHCR_IMAGE }}-${{ matrix.arch }}

  push-manifest:
    needs: [check, build-images]
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create tagged manifest
        uses: int128/docker-manifest-create-action@v2
        with:
          tags: ${{ env.IMAGE }}
          sources: |
            ${{ env.IMAGE }}-amd64
            ${{ env.IMAGE }}-arm64

      - name: Create tagged manifest for GitHub
        uses: int128/docker-manifest-create-action@v2
        with:
          tags: ${{ env.GHCR_IMAGE }}
          sources: |
            ${{ env.GHCR_IMAGE }}-amd64
            ${{ env.GHCR_IMAGE }}-arm64
